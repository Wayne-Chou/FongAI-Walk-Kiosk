<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>FongAI - 選擇檢測項目</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6f4e37;
        --primary-dark: #4e342e;
        --bg: #f3efe9;
        --shadow-lg: 0 24px 60px rgba(60, 40, 28, 0.12);
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "Noto Sans TC", sans-serif;
        background: var(--bg);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .tablet-shell {
        width: 920px;
        height: 600px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.7);
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        backdrop-filter: blur(20px);
        display: flex;
        flex-direction: column;
        padding: 32px 44px;
        position: relative;
      }
      .app-header {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo-box {
        width: 50px;
        height: 50px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        display: grid;
        place-items: center;
        box-shadow: 0 8px 18px rgba(111, 78, 55, 0.18);
      }
      .app-header h1 {
        font-size: 1.7rem;
        font-weight: 900;
        color: var(--primary);
      }

      /* 主區 */
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
      }
      .lead {
        text-align: center;
      }
      .lead h2 {
        font-size: 2rem;
        font-weight: 900;
        color: #2b2018;
        margin-bottom: 6px;
      }
      .lead p {
        font-size: 1.15rem;
        color: #6b5b4d;
        font-weight: 500;
      }

      /* 兩顆並排大選擇鈕 */
      .pick-row {
        display: flex;
        gap: 24px;
      }
      .pick-btn {
        flex: 1;
        background: #fff;
        border: 2px solid #e0d3c2;
        padding: 32px 24px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        box-shadow: 0 8px 22px rgba(60, 40, 28, 0.08);
        transition:
          border-color 0.15s,
          background 0.15s,
          transform 0.15s,
          box-shadow 0.15s;
      }
      .pick-btn:hover {
        border-color: var(--primary);
        background: #faf6f1;
        transform: translateY(-3px);
        box-shadow: 0 14px 30px rgba(111, 78, 55, 0.16);
      }
      .pick-btn:active {
        transform: scale(0.98);
      }
      .pick-ico {
        width: 84px;
        height: 84px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        display: grid;
        place-items: center;
        box-shadow: 0 8px 18px rgba(111, 78, 55, 0.22);
      }
      .pick-ico i {
        font-size: 2.4rem;
        color: #fff;
      }
      .pick-name {
        font-size: 1.6rem;
        font-weight: 900;
        color: #2b2018;
      }
      .pick-desc {
        font-size: 1.02rem;
        color: #7a6a5b;
        line-height: 1.5;
        text-align: center;
      }
      .pick-time {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 1rem;
        font-weight: 800;
        color: var(--primary);
        background: #efe7dc;
        padding: 8px 16px;
      }

      /* ── 彈窗 ── */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(43, 32, 24, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 100;
      }
      .overlay.show {
        display: flex;
      }
      .modal {
        background: #fff;
        padding: 34px 32px;
        max-width: 500px;
        width: 100%;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      }
      .modal h2 {
        font-size: 1.6rem;
        font-weight: 900;
        color: #2b2018;
        margin-bottom: 8px;
      }
      .modal p {
        font-size: 1.12rem;
        color: #6b5b4d;
        line-height: 1.6;
        margin-bottom: 22px;
      }
      .modal-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      .mbtn {
        border: none;
        padding: 15px 28px;
        font-size: 1.15rem;
        font-weight: 800;
        cursor: pointer;
        font-family: "Noto Sans TC", sans-serif;
      }
      .mbtn-ghost {
        background: #f0eae3;
        color: var(--primary);
      }
      .mbtn-go {
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="tablet-shell">
      <header class="app-header">
        <div class="logo-box">
          <img
            src="/assets/logo.png"
            style="width: 28px"
            onerror="this.style.display = 'none'"
          />
        </div>
        <h1>FongAI</h1>
      </header>

      <main class="main">
        <div class="lead">
          <h2>請選擇要進行的檢測</h2>
          <p>點選下方項目即可開始,請放心跟著畫面操作。</p>
        </div>

        <div class="pick-row">
          <button class="pick-btn" onclick="pick('liuli')">
            <div class="pick-ico">
              <i class="fa-solid fa-clipboard-list"></i>
            </div>
            <div class="pick-name">量六力</div>
            <div class="pick-desc">回答幾個問題,了解整體健康狀況</div>
            <div class="pick-time">
              <i class="fa-solid fa-clock"></i> 約 3 分鐘
            </div>
          </button>

          <button class="pick-btn" onclick="pick('sppb')">
            <div class="pick-ico">
              <i class="fa-solid fa-person-walking"></i>
            </div>
            <div class="pick-name">SPPB 體能</div>
            <div class="pick-desc">簡單的站立與行走動作,評估腿力與跌倒風險</div>
            <div class="pick-time">
              <i class="fa-solid fa-clock"></i> 約 2 分鐘
            </div>
          </button>
        </div>
      </main>
    </div>

    <!-- 開始前確認 -->
    <div class="overlay" id="go-overlay">
      <div class="modal">
        <h2>即將開始</h2>
        <p id="go-desc"></p>
        <div class="modal-actions">
          <button class="mbtn mbtn-ghost" onclick="closeGo()">再等一下</button>
          <button class="mbtn mbtn-go" onclick="confirmGo()">確認開始</button>
        </div>
      </div>
    </div>

    <script>
      const NAMES = { liuli: "量六力 · 健康自評", sppb: "SPPB · 體能檢測" };
      let chosen = null;

      function pick(key) {
        chosen = key;
        document.getElementById("go-desc").textContent =
          "接下來會進行「" + NAMES[key] + "」這一項檢測。";
        document.getElementById("go-overlay").classList.add("show");
      }
      function closeGo() {
        document.getElementById("go-overlay").classList.remove("show");
      }
      /* 純流程展示:確認後不串接,僅示意 */
      function confirmGo() {
        closeGo();
        alert("開始檢測:" + NAMES[chosen]);
      }
    </script>
  </body>
</html>
