<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>跌倒風險評估報告</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #f2f2f2;
        font-family: "Noto Sans TC", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 24px 14px 56px;
        color: #111;
      }
      .page {
        --score-main: #1a1410;
        --score-unit: #6b5b4e;
        --score-label: #8a7d6f;
        --score-font: "IBM Plex Mono", monospace;
        --score-line: rgba(111, 78, 55, 0.28);
        --ui-coffee: #6f4e37;
        --ui-coffee-deep: #4e342e;
        --ui-idle-bg: #fffaf5;
        --ui-idle-border: #8a6a52;
        --ui-hover-bg: #f3ebe3;
        width: 100%;
        max-width: 530px;
        display: flex;
        flex-direction: column;
        gap: 0;

        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      }
      .hd {
        background: #6f4e37;
        padding: 22px 22px 18px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .hd-name {
        font-size: 22px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.01em;
      }
      .hd-right {
        text-align: right;
      }
      .hd-date-lbl {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 3px;
      }
      .hd-date {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        color: #fff;
        font-weight: 500;
      }
      .risk-main {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #fff7ed;
        border: 2px solid #fdba74;
        border-radius: 14px;
        padding: 16px 18px;
        margin-bottom: 14px;
      }
      .risk-icon-wrap {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: #fb923c;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .risk-icon-wrap i {
        font-size: 24px;
        color: #fff;
      }
      .risk-text-main {
        font-size: 22px;
        font-weight: 900;
        color: #c2410c;
        line-height: 1.1;
      }
      .risk-text-sub {
        font-size: 13px;
        color: #9a3412;
        margin-top: 3px;
        font-weight: 400;
      }
      .spectrum-wrap {
      }
      .spectrum-label-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .spectrum-label-row span {
        font-size: 11px;
        font-weight: 700;
        color: #888;
      }
      .spectrum-bar {
        height: 14px;
        border-radius: 10px;
        background: linear-gradient(
          90deg,
          #ef4444 0%,
          #f97316 25%,
          #eab308 50%,
          #84cc16 75%,
          #22c55e 100%
        );
        position: relative;
        margin-bottom: 6px;
      }
      .spectrum-thumb {
        position: absolute;
        top: 50%;
        left: 75%;
        transform: translate(-50%, -50%);
        width: 22px;
        height: 22px;
        background: #fff;
        border: 3px solid #1a1410;
        border-radius: 50%;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }
      .spectrum-bottom {
        display: flex;
        justify-content: space-between;
      }
      .spectrum-bottom span {
        font-size: 11px;
        color: #aaa;
        font-family: "IBM Plex Mono", monospace;
      }
      .gauge-band {
        background: #fff;
        padding: 20px 22px 14px;
        border-bottom: 2px solid #f2f2f2;
      }
      .gauge-title {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.4;
        color: #111;
        margin-bottom: 12px;
      }

      .gauge-wrap {
        height: 260px;
        position: relative;
      }
      .gauge-wrap canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* ── RISK LEVEL TAG ── */
      .gauge-risk-tag {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 14px;
        padding: 12px 16px;
        border-radius: 12px;
        border: 2px solid;
      }
      .gauge-risk-tag-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .gauge-risk-tag-text {
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 0.02em;
      }

      .band-label {
        font-size: 19px;
        font-weight: 700;
        color: #111;
        margin-bottom: 16px;
      }
      .sppb-band {
        background: #fff;
        padding: 28px 24px 32px;
        border-bottom: 2px solid #f2f2f2;
      }
      .sppb-row {
        display: flex;
        align-items: stretch;
        gap: 16px;
      }
      .sppb-left {
        flex: 3;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #fffaf5;
        border: 1.5px solid #c9b49a;
        border-radius: 16px;
        padding: 18px 10px 16px;
        box-shadow:
          inset 0 1px 0 #fff,
          0 1px 3px rgba(62, 44, 32, 0.08);
      }
      .sppb-num,
      .radar-score-num {
        position: relative;
        font-family: var(--score-font);
        font-weight: 800;
        line-height: 1;
        color: var(--score-main);
        letter-spacing: -0.04em;
        white-space: nowrap;
        padding-bottom: 12px;
      }
      .sppb-num::after,
      .radar-score-num::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 40px;
        height: 1px;
        transform: translateX(-50%);
        background: var(--score-line);
      }
      .sppb-num span,
      .radar-score-num span {
        font-family: var(--score-font);
        font-weight: 600;
        color: var(--score-unit);
        margin-left: 4px;
      }
      .sppb-unit,
      .radar-score-label {
        margin-top: 10px;
        font-size: 15px;
        font-weight: 600;
        color: var(--score-label);
        white-space: nowrap;
      }
      .sppb-num {
        font-size: 64px;
      }
      .sppb-num span {
        font-size: 24px;
      }
      .sppb-num::after {
        width: 48px;
      }
      .sppb-badge {
        flex: 7;
        background: #dcfce7;
        border: 2px solid #86efac;
        color: #15803d;
        border-radius: 14px;
        padding: 16px 12px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .sppb-badge-num {
        font-size: 40px;
        font-weight: 800;
        color: #15803d;
        line-height: 1;
      }
      .sppb-badge-txt {
        font-size: 16px;
        color: #166534;
        margin-top: 8px;
        font-weight: 700;
        line-height: 1.35;
      }
      .ruler-track {
        height: 6px;
        background: #eee;
        border-radius: 10px;
        position: relative;
        margin-bottom: 8px;
      }
      .ruler-fill {
        position: absolute;
        height: 100%;
        width: 50%;
        background: #6f4e37;
        border-radius: 10px;
      }
      .ruler-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 16px;
        height: 16px;
        background: #6f4e37;
        border: 3px solid #fff;
        border-radius: 50%;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      }
      .ruler-labs {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #aaa;
        font-family: "IBM Plex Mono", monospace;
      }
      .analysis-band {
        background: #fff;
        padding: 28px 24px 32px;
        border-bottom: 2px solid #f2f2f2;
      }
      .analysis-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
      }
      .analysis-hdr .band-label {
        flex: 1;
        min-width: 0;
        margin-bottom: 0;
        font-size: 19px;
        font-weight: 700;
      }
      .analysis-seg {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .analysis-seg-btn {
        height: 46px;
        min-width: 88px;
        padding: 0 14px 0 12px;
        border: 2px solid #8a6a52;
        border-radius: 10px;
        background: #fffaf5;
        color: #3b2620;
        font-family: "Noto Sans TC", sans-serif;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        box-shadow: 0 2px 0 rgba(111, 78, 55, 0.14);
        transition:
          background-color 0.12s ease,
          border-color 0.12s ease,
          box-shadow 0.12s ease,
          transform 0.08s ease;
      }
      .analysis-seg-btn::before {
        content: "";
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid currentColor;
        box-sizing: border-box;
        flex-shrink: 0;
        background: transparent;
      }
      .analysis-seg-btn.on::before {
        border-color: #fff;
        background: radial-gradient(circle, #fff 0 4px, transparent 4.5px);
      }
      .analysis-seg-btn i {
        display: none;
      }
      .analysis-seg-btn:hover:not(.on) {
        background: #f3ebe3;
        border-color: #6f4e37;
        box-shadow: 0 3px 0 rgba(111, 78, 55, 0.18);
      }
      .analysis-seg-btn:focus-visible {
        outline: 3px solid var(--ui-coffee);
        outline-offset: 2px;
      }
      .analysis-seg-btn:active {
        transform: translateY(1px);
        box-shadow: none;
      }
      .analysis-seg-btn.on {
        background: #6f4e37;
        border-color: #6f4e37;
        color: #ffffff;
        box-shadow: 0 2px 0 #4e342e;
      }
      .analysis-seg-btn.on:hover {
        background: #6f4e37;
        border-color: #6f4e37;
      }
      .radar-summary {
        display: grid;
        grid-template-columns: 4fr 6fr;
        align-items: stretch;
        gap: 12px;
        margin-bottom: 14px;
      }
      .radar-box {
        order: 2;
        width: 100%;
        min-height: 200px;
        margin: 0;
        background: #f7f3ef;
        border: 2px solid #d8c4ad;
        border-radius: 14px;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .radar-canvas-host {
        width: 200px;
        height: 200px;
        flex-shrink: 0;
      }
      .radar-score {
        order: 1;
        min-width: 0;
        min-height: 200px;
        background: #fffaf5;
        border: 1.5px solid #c9b49a;
        border-radius: 16px;
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow:
          inset 0 1px 0 #fff,
          0 1px 3px rgba(62, 44, 32, 0.08);
      }
      .radar-score-num {
        font-size: 44px;
      }
      .radar-score-num span {
        font-size: 20px;
      }
      .radar-score-label {
        font-size: 15px;
      }
      .leg-col {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .leg-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 128px;
        padding: 16px 8px;
        border-radius: 12px;
        border: 1.5px solid #d8c4ad;
        background: #fafafa;
        text-align: center;
      }
      .leg-ico {
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .leg-ico i {
        font-size: 30px;
        color: #6f4e37;
      }
      .leg-name {
        font-size: 18px;
        font-weight: 700;
        color: #111;
        line-height: 1.2;
      }
      .leg-score {
        font-family: "IBM Plex Mono", monospace;
        font-size: 26px;
        font-weight: 700;
        color: #6f4e37;
        line-height: 1;
        white-space: nowrap;
      }
      .measure-label {
        font-size: 19px;
        font-weight: 700;
        color: #111;
        margin-bottom: 8px;
      }
      .data-view {
        display: block;
      }
      .drow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 52px;
        padding: 14px 0;
        border-bottom: 1.5px solid #f0f0f0;
        gap: 12px;
      }
      .drow:last-child {
        border-bottom: none;
      }
      .drow-l {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .drow-ico {
        width: 40px;
        height: 40px;
        background: #f7f3ef;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .drow-ico i {
        font-size: 16px;
        color: #6f4e37;
      }
      .drow-lbl {
        font-size: 16px;
        color: #333;
        font-weight: 600;
      }
      .drow-val {
        font-family: "IBM Plex Mono", monospace;
        font-size: 24px;
        font-weight: 700;
        color: #111;
        white-space: nowrap;
      }
      .fit-hidden {
        display: none;
      }
      .result-band {
        padding: 14px 20px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #fffaf5;
        border: 1.5px solid #d8c4ad;
      }
      .result-band[data-grade="A"] .result-grade,
      .result-band[data-level="danger"] .result-grade {
        background: #dc3545;
        color: #ffffff;
        border-color: #b02a37;
      }
      .result-band[data-grade="B"] .result-grade,
      .result-band[data-level="high"] .result-grade {
        background: #ffc107;
        color: #3a2a00;
        border-color: #8a6a1a;
      }
      .result-band[data-grade="C"] .result-grade,
      .result-band[data-level="mid"] .result-grade {
        background: #0d6efd;
        color: #ffffff;
        border-color: #0a58ca;
      }
      .result-band[data-grade="D"] .result-grade,
      .result-band[data-level="low"] .result-grade {
        background: #198754;
        color: #ffffff;
        border-color: #146c43;
      }
      .result-band[data-grade="E"] .result-grade,
      .result-band[data-level="vlow"] .result-grade {
        background: #0f766e;
        color: #ffffff;
        border-color: #0c5e58;
      }
      .result-band[data-grade="A"] .result-grade-val,
      .result-band[data-level="danger"] .result-grade-val,
      .result-band[data-grade="C"] .result-grade-val,
      .result-band[data-level="mid"] .result-grade-val,
      .result-band[data-grade="D"] .result-grade-val,
      .result-band[data-level="low"] .result-grade-val,
      .result-band[data-grade="E"] .result-grade-val,
      .result-band[data-level="vlow"] .result-grade-val {
        color: #ffffff;
      }
      .result-band[data-grade="B"] .result-grade-val,
      .result-band[data-level="high"] .result-grade-val {
        color: #3a2a00;
      }
      .result-grade {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: #0d6efd;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        gap: 0;
        border: 1px solid #0a58ca;
        box-shadow: none;
      }
      .result-grade-lbl {
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 1px;
      }
      .result-grade-val {
        font-size: 36px;
        font-weight: 800;
        color: inherit;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .result-body {
        min-width: 0;
      }
      .result-tag {
        font-size: 15px;
        letter-spacing: 0.04em;
        color: #8a7d6f;
        margin-bottom: 4px;
        line-height: 1.6;
      }
      .result-title {
        font-size: 20px;
        font-weight: 700;
        color: #1a1410;
        line-height: 1.25;
        margin-bottom: 0;
        white-space: nowrap;
      }
      .result-grade-wrapper {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .result-grade-text {
        color: #8a7d6f;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;
        flex-shrink: 0;
      }
      /* 中度風險 */

      .risk-mid {
        background: #fefce8;
        border-color: #fde047;
      }

      .risk-mid .gauge-risk-tag-dot {
        background: #ffd039;
      }

      .risk-mid .gauge-risk-tag-text {
        color: #854d0e;
      }

      .peer-mid {
        background: #fefce8;
        border-color: #fde047;
      }

      .peer-mid .sppb-badge-num {
        color: #854d0e;
      }

      .peer-mid .sppb-badge-txt {
        color: #a16207;
      }
      /* 危險 */

      .risk-danger {
        background: #fef2f2;
        border-color: #fca5a5;
      }

      .risk-danger .gauge-risk-tag-dot {
        background: #ff5757;
      }

      .risk-danger .gauge-risk-tag-text {
        color: #b91c1c;
      }

      .peer-danger {
        background: #fef2f2;
        border-color: #fca5a5;
      }

      .peer-danger .sppb-badge-num {
        color: #b91c1c;
      }

      .peer-danger .sppb-badge-txt {
        color: #dc2626;
      }
      .next-band {
        background: #f7f3ef;
        border-top: 2px solid #e7dccf;
        padding: 20px 22px;
      }
      .next-actions {
        display: flex;
        gap: 10px;
      }
      .next-ghost {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px 20px;
        border: 1.5px solid #d8c4ad;
        border-radius: 10px;
        color: #6f4e37;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
      }
      .next-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #6f4e37;
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        font-size: 15px;
        padding: 14px;
        border-radius: 10px;
      }
      .result-view-switch {
        display: flex;
        gap: 12px;
        padding: 16px 22px;
        background: #fff;
        border-bottom: 2px solid #f2f2f2;
      }
      .result-view-btn {
        flex: 1;
        height: 56px;
        padding: 0 14px;
        border: 2px solid #8a6a52;
        border-radius: 12px;
        background: #fffaf5;
        color: #3b2620;
        font-family: "Noto Sans TC", sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        box-shadow: 0 3px 0 rgba(111, 78, 55, 0.18);
        transition:
          background-color 0.12s ease,
          border-color 0.12s ease,
          box-shadow 0.12s ease,
          transform 0.08s ease;
      }
      .result-view-btn::before {
        content: "";
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid currentColor;
        box-sizing: border-box;
        flex-shrink: 0;
        background: transparent;
      }
      .result-view-btn.on::before {
        border-color: #fff;
        background: radial-gradient(circle, #fff 0 5px, transparent 5.5px);
      }
      .result-view-btn:hover:not(.on) {
        background: #f3ebe3;
        border-color: #6f4e37;
        box-shadow: 0 4px 0 rgba(111, 78, 55, 0.22);
      }
      .result-view-btn:focus-visible {
        outline: 3px solid var(--ui-coffee);
        outline-offset: 2px;
      }
      .result-view-btn:active {
        transform: translateY(1px);
        box-shadow: none;
      }
      .result-view-btn .fa-check {
        display: none;
      }
      .result-view-btn.on {
        background: #6f4e37;
        border-color: #6f4e37;
        color: #ffffff;
        box-shadow: 0 3px 0 #4e342e;
      }
      .result-view-btn.on:hover {
        background: #6f4e37;
        border-color: #6f4e37;
      }
      .gauge-band.is-hidden,
      .sppb-band.is-hidden,
      .analysis-band.is-hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hd">
        <div>
          <div class="hd-name">王小明 先生</div>
        </div>
        <div class="hd-right">
          <div class="hd-date-lbl">檢測日期</div>
          <div class="hd-date">2024-10-24</div>
        </div>
      </div>

      <div class="result-view-switch">
        <button
          type="button"
          class="result-view-btn on"
          id="btnOverall"
          onclick="switchResultView('overall')"
        >
          <span>整體結果</span>
          <i class="fa-solid fa-check" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="result-view-btn"
          id="btnFitness"
          onclick="switchResultView('fitness')"
        >
          <span>三項體能</span>
          <i class="fa-solid fa-check" aria-hidden="true"></i>
        </button>
      </div>

      <div class="gauge-band">
        <div class="gauge-title">跌倒風險評估</div>
        <div class="gauge-wrap"><canvas id="gaugeChart"></canvas></div>
        <div class="gauge-risk-tag" id="riskTag">
          <div class="gauge-risk-tag-dot" id="riskDot"></div>
          <div class="gauge-risk-tag-text" id="riskText"></div>
        </div>
        
      </div>

      <div class="sppb-band">
        <div class="sppb-row">
          <div class="sppb-left">
            <div class="sppb-num">9<span> /12</span></div>
            <div class="sppb-unit">滿分 12 分</div>
          </div>
          <div class="sppb-badge">
            <div class="sppb-badge-num">50%</div>
            <div class="sppb-badge-txt">優於同齡長者</div>
          </div>
         
        </div>
       
      </div>

      <div class="analysis-band is-hidden">
        <div class="analysis-hdr">
          <div class="band-label">三項體能測驗</div>
          <div class="analysis-seg">
            <button
              type="button"
              class="analysis-seg-btn on"
              id="btnRadar"
              onclick="sw('radar')"
            >
              <i class="fa-solid fa-chart-pie" aria-hidden="true"></i>
              圖表
            </button>
            <button
              type="button"
              class="analysis-seg-btn"
              id="btnData"
              onclick="sw('data')"
            >
              <i class="fa-solid fa-table-list" aria-hidden="true"></i>
              數據
            </button>
          </div>
        </div>
        <div id="radarView">
          <div class="radar-summary">
            <div class="radar-box">
              <div class="radar-canvas-host">
                <canvas id="radarChart"></canvas>
              </div>
            </div>
            <div class="radar-score">
              <div class="radar-score-num">9<span> /12</span></div>
              <div class="radar-score-label">滿分 12 分</div>
            </div>
          </div>
          <div class="leg-col">
            <div class="leg-row">
              <div class="leg-ico"><i class="fa-solid fa-person-rays"></i></div>
              <b class="leg-name">平衡</b>
              <span class="leg-score">3/4</span>
            </div>
            <div class="leg-row">
              <div class="leg-ico"><i class="fa-solid fa-chair"></i></div>
              <b class="leg-name">起坐</b>
              <span class="leg-score">3/4</span>
            </div>
            <div class="leg-row">
              <div class="leg-ico">
                <i class="fa-solid fa-person-walking"></i>
              </div>
              <b class="leg-name">步行</b>
              <span class="leg-score">3/4</span>
            </div>
          </div>
        </div>
        <div id="dataView" class="fit-hidden">
          <div class="measure-label">測量數據</div>
          <div class="data-view">
            <div class="drow">
              <div class="drow-l">
                <div class="drow-ico">
                  <i class="fa-solid fa-person-walking"></i>
                </div>
                <span class="drow-lbl">步行速度</span>
              </div>
              <span class="drow-val">4.82 秒</span>
            </div>
            <div class="drow">
              <div class="drow-l">
                <div class="drow-ico"><i class="fa-solid fa-chair"></i></div>
                <span class="drow-lbl">五次起坐測試</span>
              </div>
              <span class="drow-val">12.5 秒</span>
            </div>
            <div class="drow">
              <div class="drow-l">
                <div class="drow-ico">
                  <i class="fa-solid fa-shoe-prints"></i>
                </div>
                <span class="drow-lbl">並排站立</span>
              </div>
              <span class="drow-val">10 秒</span>
            </div>
            <div class="drow">
              <div class="drow-l">
                <div class="drow-ico">
                  <i class="fa-solid fa-shoe-prints" style="opacity: 0.6"></i>
                </div>
                <span class="drow-lbl">半並排站立</span>
              </div>
              <span class="drow-val">10 秒</span>
            </div>
            <div class="drow">
              <div class="drow-l">
                <div class="drow-ico">
                  <i
                    class="fa-solid fa-shoe-prints"
                    style="transform: rotate(90deg)"
                  ></i>
                </div>
                <span class="drow-lbl">直線站立</span>
              </div>
              <span class="drow-val">10 秒</span>
            </div>
          </div>
        </div>
      </div>

      <div class="result-band" data-grade="C">
        <div class="result-grade-text">VIVIFRAIL 等級</div>
        <div class="result-grade-wrapper">
          <div class="result-body">
            <div class="result-title">衰弱前期者</div>
          </div>
          <div class="result-grade">
            <div class="result-grade-val">C</div>
          </div>
        </div>
      </div>

      <div class="next-band">
        <div class="next-actions">
          <a class="next-ghost" href="index.html">回首頁</a>
          <a class="next-btn" href="liuli.html">接著做量六力 →</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      function sw(type) {
        const radarView = document.getElementById("radarView");
        const dataView = document.getElementById("dataView");
        const btnRadar = document.getElementById("btnRadar");
        const btnData = document.getElementById("btnData");
        const showChart = type === "radar";

        radarView.classList.toggle("fit-hidden", !showChart);
        dataView.classList.toggle("fit-hidden", showChart);
        btnRadar.classList.toggle("on", showChart);
        btnData.classList.toggle("on", !showChart);

        if (showChart) {
          requestAnimationFrame(function () {
            if (radarChartInst) radarChartInst.resize();
          });
        }
      }

      function switchResultView(view) {
        const gaugeBand = document.querySelector(".gauge-band");
        const sppbBand = document.querySelector(".sppb-band");
        const analysisBand = document.querySelector(".analysis-band");
        const btnOverall = document.getElementById("btnOverall");
        const btnFitness = document.getElementById("btnFitness");
        const showOverall = view === "overall";

        gaugeBand.classList.toggle("is-hidden", !showOverall);
        sppbBand.classList.toggle("is-hidden", !showOverall);
        analysisBand.classList.toggle("is-hidden", showOverall);
        btnOverall.classList.toggle("on", showOverall);
        btnFitness.classList.toggle("on", !showOverall);

        requestAnimationFrame(function () {
          if (showOverall && gaugeChartInst) gaugeChartInst.resize();
          if (
            !showOverall &&
            radarChartInst &&
            !document.getElementById("radarView").classList.contains("fit-hidden")
          ) {
            radarChartInst.resize();
          }
        });
      }
      const score = 9;
      const RC = {
        danger: "#ff5757",
        high: "#ffa203",
        mid: "#ffd039",
        low: "#8cff00",
        vlow: "#4ffa00",
      };
      const bgMap = {
        danger: "#fef2f2",
        high: "#fff7ed",
        mid: "#fefce8",
        low: "#f7fee7",
        vlow: "#f0fdf4",
      };
      const borderMap = {
        danger: "#fca5a5",
        high: "#fdba74",
        mid: "#fde047",
        low: "#bef264",
        vlow: "#86efac",
      };
      const textMap = {
        danger: "#b91c1c",
        high: "#c2410c",
        mid: "#854d0e",
        low: "#3f6212",
        vlow: "#166534",
      };
      const labelMap = {
        danger: "目前跌倒風險偏高，請特別注意",
        high: "跌倒風險較高，建議積極改善",
        mid: "跌倒風險中等，持續關注為佳",
        low: "跌倒風險稍低，狀況良好",
        vlow: "跌倒風險低，體能表現優異",
      };

      function getLevel(v) {
        if (v <= 2) return { key: "danger", text: "危險", color: RC.danger };
        if (v <= 5) return { key: "high", text: "高風險", color: RC.high };
        if (v <= 8) return { key: "mid", text: "中度風險", color: RC.mid };
        if (v <= 11) return { key: "low", text: "稍低風險", color: RC.low };
        return { key: "vlow", text: "低風險", color: RC.vlow };
      }
      const lv = getLevel(score);

      // render risk tag
      const tag = document.getElementById("riskTag");
      const dot = document.getElementById("riskDot");
      const txt = document.getElementById("riskText");
      tag.style.background = bgMap[lv.key];
      tag.style.borderColor = borderMap[lv.key];
      dot.style.background = lv.color;
      txt.style.color = textMap[lv.key];
      txt.textContent = "目前風險等級：" + lv.text + "　" + labelMap[lv.key];

      const gaugeChartInst = new Chart(document.getElementById("gaugeChart"), {
        type: "doughnut",
        data: {
          datasets: [
            {
              data: [1, 1, 1, 1, 1],
              backgroundColor: [RC.vlow, RC.low, RC.mid, RC.high, RC.danger],
              circumference: 180,
              rotation: 270,
              borderWidth: 4,
              borderColor: "#fff",
              cutout: "72%",
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 20, left: 22, right: 22, bottom: 0 } },
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
        },
        plugins: [
          {
            id: "g",
            afterDraw(chart) {
              const { ctx, chartArea } = chart;
              const cx = (chartArea.left + chartArea.right) / 2,
                cy = chartArea.bottom - 10;
              const ir = chart.getDatasetMeta(0).controller.innerRadius;
              ctx.save();
              const ang = Math.PI + Math.PI * ((12 - score) / 12);
              const tx = cx + Math.cos(ang) * (ir - 5),
                ty = cy + Math.sin(ang) * (ir - 5);
              const sx = cx + Math.cos(ang) * 10,
                sy = cy + Math.sin(ang) * 10;
              ctx.beginPath();
              ctx.moveTo(sx, sy);
              ctx.lineTo(tx, ty);
              ctx.strokeStyle = "#111";
              ctx.lineWidth = 3;
              ctx.lineCap = "round";
              ctx.stroke();
              const ba = 0.38;
              ctx.beginPath();
              ctx.moveTo(tx, ty);
              ctx.lineTo(
                tx - 9 * Math.cos(ang - ba),
                ty - 9 * Math.sin(ang - ba),
              );
              ctx.lineTo(
                tx - 9 * Math.cos(ang + ba),
                ty - 9 * Math.sin(ang + ba),
              );
              ctx.closePath();
              ctx.fillStyle = "#111";
              ctx.fill();
              ctx.beginPath();
              ctx.arc(cx, cy, 8, 0, Math.PI * 2);
              ctx.fillStyle = "#111";
              ctx.fill();
              ctx.beginPath();
              ctx.arc(cx, cy, 4, 0, Math.PI * 2);
              ctx.fillStyle = "#fff";
              ctx.fill();
              ctx.font = '700 15px "Noto Sans TC",sans-serif';
              ctx.fillStyle = "#111";
              ctx.textAlign = "center";
              ctx.textBaseline = "top";
              ctx.fillText("風險等級：" + lv.text, cx, cy + 14);
              ctx.restore();
            },
          },
        ],
      });

      const radarChartInst = new Chart(document.getElementById("radarChart"), {
        type: "radar",
        data: {
          labels: ["平衡", "起坐", "步行"],
          datasets: [
            {
              data: [3, 3, 3],
              backgroundColor: "rgba(111,78,55,0.12)",
              borderColor: "#6f4e37",
              borderWidth: 2.5,
              pointRadius: 4,
              pointBackgroundColor: "#6f4e37",
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              min: 0,
              max: 4,
              ticks: { display: false },
              pointLabels: { display: false },
              grid: { color: "rgba(111,78,55,0.15)" },
              angleLines: { color: "rgba(111,78,55,0.15)" },
            },
          },
          plugins: { legend: { display: false } },
        },
      });
    </script>
  </body>
</html>
