<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>檢測成功</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #16181c;
        --gray: #9a9a9a;
        --line: #e9e9e9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        font-family:
          "PingFang TC",
          "Microsoft JhengHei",
          "Noto Sans TC",
          -apple-system,
          sans-serif;
        overflow: hidden;
      }

      /* ---------- 展示用的「檢測中」畫面 ---------- */
      .demo-screen {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        transition: opacity 0.3s ease;
      }
      .demo-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .demo-title {
        font-size: 14px;
        letter-spacing: 3px;
        color: var(--gray);
      }

      .demo-btn {
        padding: 12px 28px;
        background: var(--ink);
        color: #fff;
        border: none;
        border-radius: 999px;
        font-size: 14px;
        letter-spacing: 2px;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }
      .demo-btn:hover {
        opacity: 0.85;
      }
      .demo-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }

      /* ---------- 疊加層 ---------- */
      .success-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        opacity: 0;
        pointer-events: none;
        z-index: 999;
        transition: opacity 0.4s ease;
        overflow: hidden;
        perspective: 900px;
      }
      .success-overlay.active {
        opacity: 1;
      }
      .success-overlay.fade-out {
        opacity: 0;
      }

      /* ---------- 立體疊層字 ---------- */
      .title-row {
        display: flex;
        gap: clamp(6px, 1.4vw, 14px);
      }

      .char3d {
        font-size: clamp(46px, 10vw, 78px);
        font-weight: 900;
        display: inline-block;
        will-change: transform;
        filter: drop-shadow(0 14px 16px rgba(0, 0, 0, 0.16));
      }

      .replay {
        position: absolute;
        bottom: 34px;
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 20px;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--gray);
        font-size: 12px;
        letter-spacing: 2px;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.2s ease;
        z-index: 3;
        pointer-events: auto;
      }
      .replay:hover {
        border-color: var(--ink);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="demo-screen">
      <div class="demo-title">這裡模擬你原本的檢測畫面</div>
      <button class="demo-btn" id="startDemo">模擬檢測完成</button>
    </div>

    <div class="success-overlay" id="successOverlay">
      <div class="title-row" id="titleRow">
        <span class="char3d" id="c0">檢</span
        ><span class="char3d" id="c1">測</span
        ><span class="char3d" id="c2">成</span
        ><span class="char3d" id="c3">功</span>
      </div>
      <button class="replay" id="replayBtn">重新播放</button>
    </div>

    <script>
      /* ============================================================
   純 CSS/JS 疊層立體字：用多層 text-shadow 堆出「刻字浮雕」厚度，
   不需要 three.js，也不會有方塊邊框線的問題。
   四個字依序從左／上／右／下飛入，依序到位，落地帶回彈。
   ============================================================ */

      function hexToRgb(hex) {
        const n = parseInt(hex.replace("#", ""), 16);
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }
      function lerpColor(a, b, t) {
        const A = hexToRgb(a),
          B = hexToRgb(b);
        const r = Math.round(A.r + (B.r - A.r) * t);
        const g = Math.round(A.g + (B.g - A.g) * t);
        const bch = Math.round(A.b + (B.b - A.b) * t);
        return `rgb(${r},${g},${bch})`;
      }

      /* 產生疊層陰影字串，做出立體厚度 */
      function buildExtrudeShadow(steps, colorFrom, colorTo) {
        const layers = [];
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const c = lerpColor(colorFrom, colorTo, t);
          layers.push(`${i * 0.9}px ${i * 0.9}px 0 ${c}`);
        }
        return layers.join(", ");
      }

      /* 四個字統一使用深綠（正面就是扎實的綠色，不再泛白） */
      const CANDY_PAIRS = [
        { front: "#22a559", deep: "#0b5e2c" },
        { front: "#22a559", deep: "#0b5e2c" },
        { front: "#22a559", deep: "#0b5e2c" },
        { front: "#22a559", deep: "#0b5e2c" },
      ];

      ["c0", "c1", "c2", "c3"].forEach((id, i) => {
        const el = document.getElementById(id);
        const pair = CANDY_PAIRS[i];
        el.style.color = pair.front;
        el.style.textShadow = buildExtrudeShadow(16, pair.front, pair.deep);
      });

      /* ============================================================
   四方依序飛入
   ============================================================ */
      const DIRECTIONS = ["left", "top", "right", "bottom"];
      const LAUNCH_GAP = 430;
      const FLY_MS = 480;
      const SETTLE_MS = 190;

      function getStartTransform(dir) {
        switch (dir) {
          case "left":
            return { x: -820, y: 0, rot: -16 };
          case "right":
            return { x: 820, y: 0, rot: 16 };
          case "top":
            return { x: 0, y: -560, rot: -10 };
          case "bottom":
            return { x: 0, y: 560, rot: 10 };
        }
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }
      function easeOutQuad(t) {
        return 1 - (1 - t) * (1 - t);
      }

      let fxRAF = null;

      function runCharRelay(onAllLanded) {
        const els = ["c0", "c1", "c2", "c3"].map((id) =>
          document.getElementById(id),
        );
        const fxStart = performance.now();
        let finalePlayed = false;

        const states = els.map((el, i) => {
          const dir = DIRECTIONS[i];
          const start = getStartTransform(dir);
          const overshootX = start.x === 0 ? 0 : start.x > 0 ? -10 : 10;
          const overshootY = start.y === 0 ? 0 : start.y > 0 ? -8 : 8;
          return {
            el,
            dir,
            start,
            overshootX,
            overshootY,
            launchAt: i * LAUNCH_GAP,
            landed: false,
          };
        });

        function apply(el, x, y, rot, scale) {
          el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
          el.style.opacity = "1";
        }

        // 初始狀態
        states.forEach((s) => {
          apply(s.el, s.start.x, s.start.y, s.start.rot, 1);
          s.el.style.opacity = s.launchAt === 0 ? "1" : "0";
        });

        function step(now) {
          const elapsed = now - fxStart;
          let allLanded = true;

          states.forEach((s) => {
            if (elapsed < s.launchAt) {
              allLanded = false;
              return;
            }
            s.el.style.opacity = "1";
            const t = elapsed - s.launchAt;

            if (t < FLY_MS) {
              allLanded = false;
              const e = easeOutCubic(t / FLY_MS);
              const x = s.start.x + (s.overshootX - s.start.x) * e;
              const y = s.start.y + (s.overshootY - s.start.y) * e;
              const rot = s.start.rot * (1 - e);
              apply(s.el, x, y, rot, 1);
            } else if (t < FLY_MS + SETTLE_MS) {
              allLanded = false;
              const e = easeOutQuad((t - FLY_MS) / SETTLE_MS);
              const x = s.overshootX + (0 - s.overshootX) * e;
              const y = s.overshootY + (0 - s.overshootY) * e;
              const scale = 1 + Math.sin(e * Math.PI) * 0.08;
              apply(s.el, x, y, 0, scale);
            } else {
              apply(s.el, 0, 0, 0, 1);
              s.landed = true;
            }
          });

          if (allLanded && !finalePlayed) {
            finalePlayed = true;
            playFinalPulse(states, onAllLanded);
            return; // finale 接手渲染
          }

          if (!allLanded) {
            fxRAF = requestAnimationFrame(step);
          }
        }
        fxRAF = requestAnimationFrame(step);
      }

      function playFinalPulse(states, onAllLanded) {
        const start = performance.now();
        const DUR = 260;
        function step(now) {
          const t = Math.min((now - start) / DUR, 1);
          const s = 1 + Math.sin(t * Math.PI) * 0.06;
          states.forEach((st) => {
            st.el.style.transform = `translate(0px,0px) rotate(0deg) scale(${s})`;
          });
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            states.forEach((st) => {
              st.el.style.transform =
                "translate(0px,0px) rotate(0deg) scale(1)";
            });
            if (onAllLanded) onAllLanded();
          }
        }
        requestAnimationFrame(step);
      }

      /* ============================================================
   整體時序控制
   ============================================================ */
      let dismissTimer = null;

      function resetVisualState() {
        if (fxRAF) cancelAnimationFrame(fxRAF);
        if (dismissTimer) clearTimeout(dismissTimer);
        document.querySelectorAll(".char3d").forEach((el) => {
          el.style.opacity = "0";
        });
      }

      function showDetectionSuccess() {
        const overlay = document.getElementById("successOverlay");
        resetVisualState();
        overlay.classList.remove("fade-out");
        overlay.classList.add("active");

        runCharRelay(() => {
          dismissTimer = setTimeout(() => {
            overlay.classList.add("fade-out");
            setTimeout(() => {
              overlay.classList.remove("active");
              resetVisualState();
              document.querySelector(".demo-screen").classList.remove("hidden");
            }, 450);
          }, 1300);
        });
      }

      /* ---------- Demo 綁定 ---------- */
      window.addEventListener("DOMContentLoaded", () => {
        const startDemo = document.getElementById("startDemo");
        const replayBtn = document.getElementById("replayBtn");
        const demoScreen = document.querySelector(".demo-screen");

        startDemo.addEventListener("click", () => {
          startDemo.disabled = true;
          startDemo.textContent = "檢測中...";
          setTimeout(() => {
            demoScreen.classList.add("hidden");
            showDetectionSuccess();
            startDemo.disabled = false;
            startDemo.textContent = "模擬檢測完成";
          }, 1200);
        });

        replayBtn.addEventListener("click", showDetectionSuccess);
      });
    </script>
  </body>
</html>
