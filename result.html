<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>FongAI 步態分析結果</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Roboto+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      :root {
        --base-bg: #ffffff;
        --page-bg: #f1f5f9;
        --main-text: #1e293b;
        --sub-text: #64748b;
        --brand-blue: #3b82f6;
        --border-color: #cbd5e1;
        --color-danger: #ff5757;
        --color-high: #ffa203;
        --color-medium: #ffd039;
        --color-low: #8cff00;
        --color-low2: #4ffa00;
        --nav-dark: #111827;
        --action-green: #10b981;
        --secondary-gray: #475569;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

        -webkit-tap-highlight-color: transparent;

        scroll-behavior: smooth;
      }

      body {
        background: var(--page-bg);
        color: var(--main-text);
        line-height: 1.6;
        overflow-x: hidden;
      }
      .logo-wrapper img {
        height: 35px;
        width: auto;
      }

      /* TOP NAV */
      .top-nav {
        height: 70px;
        background: var(--nav-dark);
        color: white;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 0 5%;

        width: 100%;
      }
      .nav-brand {
        font-size: 1.3rem;
        font-weight: 900;
        letter-spacing: 2px;
      }
      .nav-brand span {
        color: #3b82f6;
      }

      /* 單欄容器 */
      .layout-container {
        margin: 0 auto;
        padding: 20px 20px 0;
        max-width: 860px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: #fff;
      }

      /* FLOW CARD */
      .flow-card {
        display: flex;
        flex-direction: column;
        background: #f8fafc;
        border: 1px solid var(--border-color);
        border-left: 5px solid var(--color-high);
      }

      /* RESULT COLUMNS：Vivifrail 面板 + 同齡排行榜內容 並排 50/50
         本身不額外加 padding，兩欄各自的內距分別交給
         .vivifrail-panel 的卡片 padding 與 .flow-content 原本既有的 padding 負責
         align-items 明確設為 stretch（預設值），確保兩欄格高一致，
         兩欄內容再各自撐滿到這個格高 */
      .result-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: stretch;
        gap: 20px;
      }

      /* VIVIFRAIL 面板：Logo + 等級徽章的獨立小卡片
         height: 100% 讓它明確撐滿 .result-columns 分配到的格高，
         不只是依賴 grid 預設 stretch 行為 */
      .vivifrail-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        background: #f8fafc;
        border: 1.5px solid rgba(13, 110, 253, 0.35);
        border-radius: 12px;
        padding: 24px 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        height: 100%;
      }
      .vivifrail-logo {
        width: 100%;
        max-width: 180px;
        height: auto;
      }

      /* VIVIFRAIL 徽章：等級色塊 + 分類文字（已改為一般文件流排版，不再絕對定位） */
      .vivifrail-badge {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f8fafc;
        border: 2px solid #b45309;
        color: var(--main-text);
        font-weight: 900;
        line-height: 1;
        padding: 9px;
        border-radius: 12px;
        white-space: nowrap;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }
      .badge-level {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
      }
      /* A~D 四個等級的顏色系統：換等級時只需切換這個 class + 文字內容 */
      .badge-level.level-a {
        background: #dc3545;
        color: #ffffff;
      }
      .badge-level.level-b {
        background: #ffc107;
        color: #ffffff;
      }
      .badge-level.level-c {
        background: #0d6efd;
        color: #ffffff;
      }
      .badge-level.level-d {
        background: #198754;
        color: #ffffff;
      }
      .badge-text {
        font-size: 19px;
        color: #1e293b;
      }

      /* 手機（<= 600px）：縮小，並改成上下堆疊（Vivifrail 面板在上、排行榜內容在下） */
      @media (max-width: 600px) {
        .result-columns {
          grid-template-columns: 1fr;
        }
        .vivifrail-badge {
          gap: 9px;
          padding: 7px;
        }
        .badge-level {
          width: 30px;
          height: 30px;
          font-size: 16px;
        }
        .badge-text {
          font-size: 17px;
        }
      }

      /* 平板（601px ~ 1024px）：沿用桌面版 50/50 並排，僅微調徽章內部間距 */
      @media (min-width: 601px) and (max-width: 1024px) {
        .vivifrail-badge {
          gap: 14px;
          padding: 11px;
        }
        .badge-level {
          width: 48px;
          height: 48px;
          font-size: 22px;
        }
        .badge-text {
          font-size: 23px;
        }
      }

      /* HEADER SECTION */
      .report-header {
        background: white;
        padding: 25px 40px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
      }
      .report-header h1 {
        font-size: 2.2rem;
        font-weight: 900;
      }

      /* QR Code 區塊 */
      .qr-block {
        display: flex;

        align-items: center;
        gap: 6px;
        text-align: center;
        background: rgba(30, 78, 140, 1);
        padding: 10px;
        border-radius: 10px;
      }
      .qr-label-top {
        font-size: 20px;
        font-weight: 900;
        color: #fff;
        letter-spacing: 0.5px;
        writing-mode: vertical-rl;
      }

      /* 跌倒風險等級標題 */
      .risk-level-header {
        margin-top: 30px;
        padding: 16px 20px;
        background: #f8fafc;
        border: 1px solid var(--border-color);
        border-left: 5px solid var(--color-high);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .risk-level-header i {
        font-size: 1.3rem;
        color: var(--color-high);
      }
      .risk-level-header-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .risk-level-header-label {
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 2px;
        color: var(--sub-text);
      }
      .risk-level-header-title {
        font-size: 1.1rem;
        font-weight: 900;
        color: var(--main-text);
      }

      /* 細項網格 */
      .skeletal-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        margin-top: 15px;
      }
      .skeletal-item {
        background: #ffffff;
        border: 1px solid var(--border-color);
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }
      .skeletal-label {
        font-size: 0.95rem;
        font-weight: 500;
        color: #374151;
        display: block;
        margin-bottom: 5px;
      }
      .skeletal-val {
        font-family: "Roboto Mono";
        font-size: 1.8rem;
        font-weight: 600;
        color: #111827;
      }
      .skeletal-status {
        font-size: 0.85rem;
        font-weight: 500;
        margin-left: 8px;
        padding: 4px 10px;
      }
      .status-normal {
        background: #dcfce7;
        color: #22c55e;
      }

      /* RISK METER */
      .risk-meter {
        margin-top: 80px;
        position: relative;
        padding: 0 10px;
        margin-bottom: 40px;
      }
      .risk-bar {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        height: 30px;
      }
      .risk-seg.low2 {
        background: var(--color-low2);
      }
      .risk-seg.low {
        background: var(--color-low);
      }
      .risk-seg.medium {
        background: var(--color-medium);
      }
      .risk-seg.high {
        background: var(--color-high);
      }
      .risk-seg.danger {
        background: var(--color-danger);
      }
      .risk-seg.active {
        opacity: 1;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .risk-labels {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        text-align: center;
        margin-top: 15px;
        color: var(--sub-text);
        font-weight: 800;
      }
      .risk-indicator {
        position: absolute;
        top: -55px;
        left: 30%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .risk-indicator span {
        background: var(--color-low);
        color: white;
        padding: 5px 12px;
        font-weight: 900;
        font-size: 0.85rem;
        margin-bottom: 5px;
      }

      /* leaderboard：欄寬變窄（右欄只剩半版寬度）後，改成垂直堆疊＋置中，
         圖示與標題在上、進度條在下，滿版寬度呈現 */
      .leaderboard-showcase {
        border: 2px solid var(--border-color);
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 20px;
        position: relative;
        transition: all 0.3s ease;
        flex: 1;
      }
      .leader-badge-left {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .leader-icon-box {
        width: 70px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        color: white;
      }
      .leader-main-data {
        display: flex;
        flex-direction: column;
      }
      .leader-title {
        font-size: 27px;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .leader-num-group {
        display: flex;
        align-items: baseline;
        gap: 2px;
        margin-top: -5px;
      }
      .leader-big-num {
        font-family: "Roboto Mono", sans-serif;
        font-size: 3.8rem;
        font-weight: 900;
      }
      .leader-unit {
        font-size: 1.4rem;
        font-weight: 900;
      }
      .leader-stats-right {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .progress-container {
        width: 100%;
        height: 14px;
        background: #e2e8f0;
        border: 1px solid #cbd5e1;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        transition: width 0.5s ease-in-out;
      }
      .leader-comment {
        font-size: 0.95rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        line-height: 1.4;
      }

      .leaderboard-showcase.status-excellent {
        background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        border-color: #bbf7d0;
      }
      .status-excellent .leader-icon-box {
        background: #16a34a;
      }
      .status-excellent .leader-title {
        color: #14532d;
      }
      .status-excellent .leader-big-num,
      .status-excellent .leader-unit {
        color: #16a34a;
      }
      .status-excellent .progress-fill {
        background: linear-gradient(90deg, #4ade80 0%, #16a34a 100%);
        width: 50%;
      }
      .status-excellent .leader-comment {
        color: #166534;
      }
      .status-excellent .leader-comment i {
        color: #16a34a;
      }

      .leaderboard-showcase.status-warning {
        background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
        border-color: #fca5a5;
      }
      .status-warning .leader-icon-box {
        background: #f97316;
      }
      .status-warning .leader-title {
        color: #7c2d12;
      }
      .status-warning .leader-big-num,
      .status-warning .leader-unit {
        color: #ea580c;
      }
      .status-warning .progress-fill {
        background: linear-gradient(90deg, #fb923c 0%, #f97316 100%);
        width: 50%;
      }
      .status-warning .leader-comment {
        color: #9a3412;
      }
      .status-warning .leader-comment i {
        color: #ea580c;
      }

      .leaderboard-showcase.status-danger {
        background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
        border-color: #fca5a5;
      }
      .status-danger .leader-icon-box {
        background: #ef4444;
      }
      .status-danger .leader-title {
        color: #7f1d1d;
      }
      .status-danger .leader-big-num,
      .status-danger .leader-unit {
        color: #dc2626;
      }
      .status-danger .progress-fill {
        background: linear-gradient(90deg, #f87171 0%, #ef4444 100%);
        width: 80%;
      }
      .status-danger .leader-comment {
        color: #991b1b;
      }
      .status-danger .leader-comment i {
        color: #dc2626;
      }

      /* 醫療機構推薦 */
      .hospital-section {
        background: white;
        border: 1px solid var(--border-color);
        padding: 20px 22px;
        margin-top: 20px;
      }
      .hospital-section-tag {
        font-size: 0.75rem;
        font-weight: 400;
        color: var(--sub-text);
        display: block;
        margin-bottom: 14px;
        letter-spacing: 0;
      }
      .hospital-section-title {
        font-size: 1rem;
        font-weight: 900;
        color: var(--main-text);
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
      }
      .hospital-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        gap: 12px;
        background: #fff;
      }
      .hospital-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .hospital-name {
        font-size: 1rem;
        font-weight: 700;
        color: var(--main-text);
      }
      .hospital-area {
        font-size: 0.82rem;
        color: var(--sub-text);
        font-weight: 400;
      }
      .hospital-dept {
        font-size: 0.82rem;
        color: var(--main-text);
        font-weight: 400;
        margin-top: 4px;
      }

      /* QR Code + 說明（醫院右側） */
      .hospital-qr-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .hospital-qr-label {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--brand-blue);
        text-align: center;
        line-height: 1.4;
      }
      .hospital-qr {
        width: 80px;
        height: 80px;
        object-fit: cover;
        background: #f8fafc;
      }
      .hospital-qr-hint {
        font-size: 0.72rem;
        color: var(--sub-text);
        text-align: center;
        line-height: 1.4;
      }

      /* CAMPAIGN CARD（最新消息） */
      .campaign-card {
        background: white;
        border: 1px solid var(--border-color);
        padding: 28px 30px;
      }
      .campaign-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }
      .campaign-icon {
        width: 42px;
        height: 42px;
        background: var(--brand-blue);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .campaign-icon i {
        font-size: 1.1rem;
        color: white;
      }
      .campaign-tag {
        display: block;
        font-size: 0.7rem;
        font-weight: 900;
        letter-spacing: 2px;
        color: var(--brand-blue);
        margin-bottom: 3px;
      }
      .campaign-title {
        font-size: 1.1rem;
        font-weight: 900;
        color: var(--main-text);
        margin: 0;
        line-height: 1.4;
      }
      .campaign-divider {
        height: 1px;
        background: var(--border-color);
        margin-bottom: 18px;
      }
      .campaign-content p {
        font-size: 0.95rem;
        color: var(--sub-text);
        line-height: 1.8;
        margin: 0;
      }
      .campaign-content p + p {
        margin-top: 8px;
      }

      /* FOOTER BUTTONS */
      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 40px;
      }
      .btn {
        padding: 25px;
        font-size: 1.1rem;
        font-weight: 900;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border: none;
      }
      .btn-outline {
        background: white;
        border: 2px solid var(--nav-dark);
        color: var(--nav-dark);
      }
      .btn-main {
        background: var(--nav-dark);
        color: white;
      }

      @media (max-width: 600px) {
        .report-header {
          padding: 20px 20px 0;
        }
      }
      .flow-content {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ===== 測試用：等級切換按鈕樣式 START（正式上線前可整段刪除）===== */
      .test-level-switcher {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 16px 20px;
        margin-top: 20px;
        background: #fff;
        border: 1px dashed var(--border-color);
      }
      .test-level-btn {
        padding: 10px 16px;
        font-size: 0.9rem;
        font-weight: 700;
        background: white;
        border: 2px solid var(--nav-dark);
        color: var(--nav-dark);
        border-radius: 8px;
        cursor: pointer;
      }
      .test-level-btn:hover {
        background: #f1f5f9;
      }
      .test-level-btn.active {
        background: var(--nav-dark);
        color: #ffffff;
      }
      /* ===== 測試用：等級切換按鈕樣式 END ===== */
    </style>
  </head>

  <body>
    <div style="max-width: 860px; margin: 0 auto; width: 100%">
      <nav class="top-nav">
        <div class="logo-wrapper">
          <img
            src="https://raw.githubusercontent.com/Wayne-Chou/FongAI-Walk-Kiosk/refs/heads/main/assets/logo.png"
            alt="FongAI Logo"
          />
        </div>
        <div class="nav-brand" style="text-align: center"></div>
        <div
          class="nav-partner"
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            height: 100%;
            justify-self: end;
          "
        >
          <img
            src="https://raw.githubusercontent.com/Wayne-Chou/FongAI-Walk-Kiosk/refs/heads/main/assets/NTPC_Health.png"
            alt="新北市衛生局"
            style="
              height: 60px;
              width: auto;
              filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.3));
            "
          />
        </div>
      </nav>

      <!-- 單欄容器 -->
      <div class="layout-container">
        <!-- 主內容卡片 -->
        <section class="flow-card" id="step01">
          <header class="report-header">
            <div>
              <h1>跌倒風險等級評估</h1>
            </div>
            <!-- QR Code：掃描查看完整報告 -->
            <div class="qr-block">
              <div class="qr-label-top">報告</div>
              <img
                style="width: 120px"
                src="https://raw.githubusercontent.com/Wayne-Chou/FongAI-Walk-Kiosk/refs/heads/main/assets/qrcode-demo.png"
                alt="完整報告 QR Code"
              />
            </div>
          </header>
        </section>
        <div style="background: #fff">
          <div class="gauge-section">
            <canvas id="gaugeChart"></canvas>
          </div>
          <div class="result-columns">
            <div class="vivifrail-panel">
              <img
                src="assets/logo-vivifrail.png"
                alt="Vivifrail"
                class="vivifrail-logo"
              />
              <span class="vivifrail-badge">
                <span class="badge-level level-b">B</span>
                <span class="badge-text">衰弱者</span>
              </span>
            </div>
            <div class="flow-content">
              <div class="leaderboard-showcase status-excellent">
                <div class="leader-badge-left">
                  <div class="leader-icon-box">
                    <i class="fa-solid fa-chart-line"></i>
                  </div>
                  <div class="leader-main-data">
                    <span class="leader-title">優於 50% 同齡群體</span>
                  </div>
                </div>
                <div class="leader-stats-right">
                  <div class="progress-container">
                    <div class="progress-fill"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 測試用：等級切換按鈕，正式上線前可移除 -->
        <div class="test-level-switcher">
          <button type="button" class="test-level-btn" data-level="a">
            A 失能者
          </button>
          <button type="button" class="test-level-btn active" data-level="b">
            B 衰弱者
          </button>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  function switchView(type) {
    const radarView = document.getElementById("radarView");
    const dataView = document.getElementById("dataView");
    const btnRadar = document.getElementById("btnRadar");
    const btnData = document.getElementById("btnData");
    if (type === "radar") {
      radarView.style.display = "flex";
      dataView.style.display = "none";
      btnRadar.classList.add("active");
      btnData.classList.remove("active");
    } else {
      radarView.style.display = "none";
      dataView.style.display = "grid";
      btnRadar.classList.remove("active");
      btnData.classList.add("active");
    }
  }

  // --- 最終修正版：等分軌道 + 正中指針 ---
  const ctxGauge = document.getElementById("gaugeChart");
  const score = 11; // 0~12

  const riskColors = {
    danger: "#ff5757",
    high: "#ffa203",
    medium: "#ffd039",
    low: "#8cff00",
    veryLow: "#4ffa00",
  };

  function getRiskLevel(val) {
    if (val <= 2) return { text: "危險", color: riskColors.danger };
    if (val <= 5) return { text: "高風險", color: riskColors.high };
    if (val <= 8) return { text: "中度", color: riskColors.medium };
    if (val <= 11) return { text: "稍低", color: riskColors.low };
    return { text: "低風險", color: riskColors.veryLow };
  }

  const level = getRiskLevel(score);

  new Chart(ctxGauge, {
    type: "doughnut",
    data: {
      datasets: [
        {
          // 五等份均分
          data: [1, 1, 1, 1, 1],
          backgroundColor: [
            riskColors.veryLow,
            riskColors.low,
            riskColors.medium,
            riskColors.high,
            riskColors.danger,
          ],
          circumference: 180,
          rotation: 270,
          borderWidth: 3,
          borderColor: "#ffffff",
          cutout: "80%",
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 30, bottom: 10 } },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false },
      },
    },
    plugins: [
      {
        id: "needleAndText",
        afterDraw(chart) {
          const { ctx, chartArea } = chart;
          const centerX = (chartArea.left + chartArea.right) / 2;
          const centerY = chartArea.bottom - 10;
          const innerRadius = chart.getDatasetMeta(0).controller.innerRadius;

          ctx.save();

          // 1. 繪製中心文字
          ctx.font = "bold 18px sans-serif";
          ctx.fillStyle = "#1e293b";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(`風險等級：${level.text}`, centerX, centerY);

          // 2. 繪製「直線 + 箭頭」指針

          const angle = Math.PI + Math.PI * ((12 - score) / 12);

          // 指針從圓心出發
          const startDist = 15; // 離開文字中心一點點
          const endDist = innerRadius - 2; // 接近顏色軌道
          const arrowSize = 10;

          const startX = centerX + Math.cos(angle) * startDist;
          const startY = centerY + Math.sin(angle) * startDist;
          const tipX = centerX + Math.cos(angle) * endDist;
          const tipY = centerY + Math.sin(angle) * endDist;

          // A. 繪製一直線
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(tipX, tipY);
          ctx.strokeStyle = "#334155";
          ctx.lineWidth = 3; // 稍微加粗一點，更顯眼
          ctx.stroke();

          // B. 繪製最上面的箭頭 (三角形)
          ctx.beginPath();
          ctx.moveTo(tipX, tipY);
          // 計算三角形底部兩個點，讓箭頭看起來更尖銳
          const baseAngle = 0.4;
          ctx.lineTo(
            tipX - arrowSize * Math.cos(angle - baseAngle),
            tipY - arrowSize * Math.sin(angle - baseAngle),
          );
          ctx.lineTo(
            tipX - arrowSize * Math.cos(angle + baseAngle),
            tipY - arrowSize * Math.sin(angle + baseAngle),
          );
          ctx.closePath();
          ctx.fillStyle = "#334155";
          ctx.fill();

          ctx.restore();
        },
      },
    ],
  });
</script>

<script>
  // Vivifrail 等級對照表：字母 / 顯示名稱 / 對應的 .badge-level 修飾 class
  const VIVIFRAIL_LEVELS = {
    a: { letter: "A", name: "失能者", levelClass: "level-a" },
    b: { letter: "B", name: "衰弱者", levelClass: "level-b" },
    c: { letter: "C", name: "衰弱前期者", levelClass: "level-c" },
    d: { letter: "D", name: "健康者", levelClass: "level-d" },
  };

  function setVivifrailLevel(key) {
    const info = VIVIFRAIL_LEVELS[key];
    if (!info) return;

    const levelEl = document.querySelector(".badge-level");
    const textEl = document.querySelector(".badge-text");

    if (levelEl) {
      Object.values(VIVIFRAIL_LEVELS).forEach((item) => {
        levelEl.classList.remove(item.levelClass);
      });
      levelEl.classList.add(info.levelClass);
      levelEl.textContent = info.letter;
    }

    if (textEl) {
      textEl.textContent = info.name;
    }

    document.querySelectorAll(".test-level-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.level === key);
    });
  }

  document.querySelectorAll(".test-level-btn").forEach((btn) => {
    btn.addEventListener("click", () => setVivifrailLevel(btn.dataset.level));
  });
</script>
