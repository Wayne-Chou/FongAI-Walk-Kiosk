<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>FongAI - 歡迎頁面 (直式平板專用)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      /* ==================== 全局基礎設定 ==================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Noto Sans TC", sans-serif;
        user-select: none; /* 防止平板使用者長按畫面時跳出選取文字框 */
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow-y: auto; /* 內容若超出畫面高度時可以往下捲動，不會被裁掉看不到 */
        overflow-x: hidden;
        background-color: #f0f6fa;
      }

      /* 滿版平板容器：改回一般 block 排版，避免影響跑馬燈等其他區塊的寬度計算 */
      .container {
        position: relative;
        width: 100%;
        min-height: 100%;
        padding: 30px 35px 25px 35px;
        background: radial-gradient(circle at top, #e3effa 0%, #cbdff2 100%);
      }

      /* ==================== 最頂端獨立官方指導列 ==================== */
      .government-top-bar {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        margin-bottom: 20px;
        padding: 10px 0;
      }

      .gov-logo-zone {
        height: 55px;
        display: flex;
        align-items: center;
      }

      .gov-logo-zone img {
        height: 100%;
        width: auto;
        object-fit: contain;
      }

      /* ==================== 頂部資訊列 (天氣與時間) ==================== */
      .top-info-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 16px;
        padding: 12px 25px;
        box-shadow: 0 8px 20px rgba(164, 185, 206, 0.2);
        backdrop-filter: blur(10px);
        margin-bottom: 30px;
      }

      .weather-box {
        display: flex;
        align-items: center;
      }

      .weather-icon {
        font-size: 2.2rem;
        margin-right: 10px;
        animation: float 4s ease-in-out infinite;
      }

      .weather-text {
        display: block;
        font-size: 0.95rem;
        color: #5a6e85;
        font-weight: 500;
      }

      .weather-temp {
        display: block;
        font-size: 1.8rem;
        font-weight: 700;
        color: #2c3e50;
        line-height: 1.1;
      }

      .time-box {
        text-align: right;
        color: #4a5d73;
      }

      .date-text {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 2px;
      }

      .clock-text {
        font-size: 0.95rem;
        opacity: 0.85;
      }

      /* ==================== 中間核心主視覺 (數位黑板) ==================== */
      .main-board {
        display: block;
        width: 100%;
        background: #2b3647;
        border: 12px solid #5d4037;
        border-radius: 24px;
        padding: 50px 30px;
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.25),
          inset 0 0 40px rgba(0, 0, 0, 0.5);
        position: relative;
        text-align: center;
        margin-bottom: 35px;
        min-height: 380px;
      }
      .main-board h1 {
        color: #fff;
      }

      /* ==================== 下方品牌聯絡資訊 (主辦/系統開發) ==================== */
      .info-card {
        display: block;
        width: 100%;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        padding: 25px 30px;
        box-shadow: 0 12px 30px rgba(164, 185, 206, 0.25);
        margin-bottom: 20px;
      }

      .brand-section {
        display: block;
        float: left;
        margin-top: 5px;
      }

      .logo-area {
        display: block;
        margin-bottom: 15px;
      }

      .logo-icon {
        display: inline-block;
        width: 45px;
        height: 45px;
        text-align: center;
        line-height: 45px;
        color: white;
        font-weight: 700;
        font-size: 1.4rem;
        vertical-align: middle;
        margin-right: 12px;
      }

      .logo-text {
        display: inline-block;
        font-size: 1.75rem;
        font-weight: 700;
        color: #0984e3;
        letter-spacing: 1px;
        vertical-align: middle;
      }

      .brand-description {
        display: block;
        color: #5a6e85;
        font-size: 1.05rem;
        font-weight: 500;
        margin-top: 6px;
        letter-spacing: 1px;
      }

      .qr-section {
        display: block;
        float: right;
        text-align: center;
      }

      .qr-code-wrapper {
        width: 100px;
        height: 100px;
        background: white;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        margin-bottom: 6px;
      }

      .qr-code-wrapper img {
        width: 100%;
        height: 100%;
      }

      .qr-hint {
        display: block;
        font-size: 0.85rem;
        color: #7f8c8d;
        font-weight: 500;
      }

      /* ==================== 底部導引雙卡列：手動登入(左) / 健保卡插入處(右) ====================
         不使用 position 定位，改用 flex 排版當作畫面最後一排內容，
         justify-content: space-between 讓兩張卡片自然分靠左右兩側。 */
      .bottom-guides {
        display: flex;
        justify-content: space-between;
        align-items: stretch;
        gap: 20px;
        width: 100%;
        margin-top: 10px;
      }

      .health-card-guide,
      .manual-login-guide {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 16px 20px;
        min-height: 118px;
        border-radius: 18px;
        text-align: center;
      }

      /* 健保卡插入處：加粗邊框、加深文字拉高對比，尺寸維持精簡以免版面放不下 */
      .health-card-guide {
        background: rgba(255, 255, 255, 0.94);
        border: 2px solid #00a884;
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 28px rgba(164, 185, 206, 0.32);
      }

      .health-card-guide .guide-title {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 2px;
        line-height: 1.3;
        color: #16362e;
      }

      .health-card-guide .guide-arrow {
        flex-shrink: 0;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 1.7rem;
        line-height: 1;
        color: #fff;
        background: linear-gradient(135deg, #00c9a0, #00a884);
        box-shadow: 0 8px 18px rgba(0, 168, 132, 0.4);
        animation: float 3s ease-in-out infinite;
      }

      /* 手動登入：回歸原本玻璃卡片風格，藍色 accent 加深加粗以拉高對比，尺寸維持精簡 */
      .manual-login-guide {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.94);
        border: 2px solid #0984e3;
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 28px rgba(164, 185, 206, 0.32);
        cursor: pointer;
        overflow: hidden; /* 手指落下時只在按鈕範圍內示範，不外溢到卡片外 */
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }

      /* 內層包住文字內容，示範按下時輕微縮小，模擬按鈕被點的回饋，
         跟外層分開是為了不影響使用者真正點擊時 :active 的縮放效果 */
      .login-card-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        animation: button-press-demo 3.4s ease-in-out infinite;
      }

      .manual-login-guide .guide-title {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 2px;
        line-height: 1.3;
        color: #05508f;
      }

      .manual-login-guide:active {
        transform: scale(0.97);
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 8px 18px rgba(164, 185, 206, 0.35);
      }

      .tap-hint-text {
        font-size: 0.9rem;
        font-weight: 500;
        color: #0984e3;
        letter-spacing: 1px;
      }

      /* 教學提示手勢：手指從上方淡入、落到按鈕上示範點按，停留一下後淡出抬起，
         覆蓋整張卡片置中顯示，不影響卡片版面尺寸 */
      .tap-guide-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .tap-ripple {
        position: absolute;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 3px solid rgba(9, 132, 227, 0.6);
        opacity: 0;
        animation: ripple-wave-tap 3.4s ease-in-out infinite;
      }

      .tap-guide-finger {
        position: absolute;
        font-size: 6.3rem;
        line-height: 1;
        color: #0984e3;
        filter: drop-shadow(0 6px 10px rgba(9, 132, 227, 0.35));
        transform-origin: 60% 15%;
        animation: tap-demo 3.4s ease-in-out infinite;
      }

      /* ==================== 跑馬燈：品牌色底 + 白色粗體大字，更顯眼 ==================== */
      .footer-bar {
        color: #fff;
        background: linear-gradient(135deg, #0984e3, #0868b3);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        padding: 16px 25px;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 3px;
        overflow: hidden;
        white-space: nowrap;
        box-shadow: 0 12px 26px rgba(9, 132, 227, 0.45);
        margin-bottom: 20px;
      }

      .marquee-track {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 15s linear infinite;
      }

      /* ==================== 動畫效果 ==================== */
      @keyframes marquee {
        0% {
          transform: translate3d(0, 0, 0);
        }
        100% {
          transform: translate3d(-100%, 0, 0);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-16px);
        }
      }

      /* 手指淡入落到按鈕上示範點按，停留一下後淡出抬起，接著停頓約 1.5 秒再重複循環 */
      @keyframes tap-demo {
        0%,
        8% {
          opacity: 0;
          transform: translateY(-46px) scale(1);
        }
        22% {
          opacity: 1;
          transform: translateY(-8px) scale(1);
        }
        34%,
        46% {
          opacity: 1;
          transform: translateY(8px) scale(0.94);
        }
        58% {
          opacity: 1;
          transform: translateY(-8px) scale(1);
        }
        68%,
        100% {
          opacity: 0;
          transform: translateY(-46px) scale(1);
        }
      }

      /* 波紋在手指觸碰按鈕的瞬間擴散淡出，與 tap-demo 同步 */
      @keyframes ripple-wave-tap {
        0%,
        30% {
          opacity: 0;
          transform: scale(0.3);
        }
        36% {
          opacity: 0.85;
          transform: scale(0.55);
        }
        60% {
          opacity: 0;
          transform: scale(1.8);
        }
        100% {
          opacity: 0;
          transform: scale(1.8);
        }
      }

      /* 按鈕文字內容在手指觸碰的瞬間輕微縮小，模擬被按下的回饋，與 tap-demo 同步 */
      @keyframes button-press-demo {
        0%,
        30% {
          transform: scale(1);
        }
        34%,
        46% {
          transform: scale(0.95);
        }
        60%,
        100% {
          transform: scale(1);
        }
      }

      .clearfix::after {
        content: "";
        clear: both;
        display: table;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 【第 1 層】官方合作單位列 -->
      <div class="government-top-bar">
        <div class="gov-logo-zone">
          <img src="assets/NTPC_Health.png" alt="新北市政府衛生局" />
        </div>
      </div>

      <!-- 跑馬燈 -->
      <div class="footer-bar">
        <div class="marquee-track">跌倒風險檢測</div>
      </div>

      <!-- 【第 2 層】天氣與即時時間 -->
      <div class="top-info-bar">
        <div class="weather-box">
          <div class="weather-icon">⛅</div>
          <div class="weather-status">
            <span class="weather-text">多雲時晴</span>
            <span class="weather-temp" id="tempDisplay">26°C</span>
          </div>
        </div>

        <div class="time-box">
          <div class="date-text" id="dateDisplay">2026 / 05 / 21</div>
          <div class="clock-text" id="clockDisplay">星期四 03:45 下午</div>
        </div>
      </div>

      <!-- 【第 3 層】核心影片播放區 -->
      <div class="main-board">
        <h1>放影片的地方</h1>
      </div>

      <!-- 【第 4 層】執行/主辦單位資訊卡 -->
      <div class="info-card clearfix">
        <div class="brand-section">
          <div class="logo-area">
            <div class="logo-icon">
              <img style="width: 100%" src="assets/logo.png" alt="建豐" />
            </div>

            <div class="logo-text">建豐健康科技</div>
            <span class="brand-description"
              >AI 智慧健康管理 · 步態與體態精準分析</span
            >
          </div>
        </div>

        <div class="qr-section">
          <div class="qr-code-wrapper">
            <img
              src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://fongai.co"
              alt="QR Code"
            />
          </div>
          <span class="qr-hint">掃描看更多衛教</span>
        </div>
      </div>

      <!-- 【第 5 層】底部導引雙卡：手動登入(左) / 健保卡插入處(右)，flex 排版取代 position -->
      <div class="bottom-guides">
        <div
          class="manual-login-guide"
          id="manualLoginBtn"
          onclick="handleManualLogin()"
        >
          <div class="login-card-inner">
            <div class="guide-title">手動登入</div>
            <div class="tap-hint-text">點一下開始</div>
          </div>
          <div class="tap-guide-wrap">
            <div class="tap-ripple"></div>
            <i class="fa-solid fa-hand-pointer tap-guide-finger"></i>
          </div>
        </div>

        <div class="health-card-guide">
          <div class="guide-title">健保卡插入</div>
          <div class="guide-arrow"><i class="fa-solid fa-arrow-down"></i></div>
        </div>
      </div>
    </div>

    <script>
      function updateDateTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const date = String(now.getDate()).padStart(2, "0");
        document.getElementById("dateDisplay").textContent =
          `${year} / ${month} / ${date}`;

        const weekdays = [
          "星期日",
          "星期一",
          "星期二",
          "星期三",
          "星期四",
          "星期五",
          "星期六",
        ];
        const dayOfWeek = weekdays[now.getDay()];

        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const ampm = hours >= 12 ? "下午" : "上午";
        hours = hours % 12;
        hours = hours ? hours : 12;

        document.getElementById("clockDisplay").textContent =
          `${dayOfWeek} ${String(hours).padStart(2, "0")}:${minutes} ${ampm}`;
      }

      updateDateTime();
      setInterval(updateDateTime, 1000);

      // 手動登入按鈕點擊事件（請依實際流程串接，例如跳轉輸入頁或彈出鍵盤輸入視窗）
      function handleManualLogin() {
        // TODO: 在此串接手動登入邏輯，例如導向輸入身分證字號的頁面
        console.log("手動登入按鈕被點擊");
      }
    </script>
  </body>
</html>
